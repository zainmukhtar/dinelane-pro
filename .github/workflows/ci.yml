name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      APP_ENV: test
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: dinelane_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SUPERADMIN_USERNAME: ci-admin
      SUPERADMIN_PASSWORD: ci-only-not-production
      COOKIE_SECRET: ci-cookie-secret-not-production
      VENDURE_SHOP_API_URL: http://127.0.0.1:3000/shop-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dinelane_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dinelane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.12.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
